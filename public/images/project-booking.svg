<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-booking" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262c" />
      <stop offset="50%" stop-color="#17181c" />
      <stop offset="100%" stop-color="#0f1013" />
    </linearGradient>

    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg-booking)" />

  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

  <!-- Header Title Block -->
  <g transform="translate(70, 90)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="4" fill="#38bdf8" font-weight="600" text-transform="uppercase">
      HEALTHCARE PWA · PROGRESSIVE WEB APPLICATION
    </text>
    <text font-family="'Cinzel', Georgia, serif" font-size="26" fill="#f3f4f6" y="32">
      Lorem Ipsum Project Three
    </text>
    <text font-family="monospace" font-size="11" fill="#717684" y="52" letter-spacing="1">
      TYPESCRIPT · REACT · SUPABASE · REST API · DOCTOR CALENDAR &amp; QUEUE TELEMETRY
    </text>
  </g>

  <!-- Technical Schematic: Mobile PWA Wireframe & Consultation Timeline -->
  <g transform="translate(600, 480)">
    <!-- Central Smartphone PWA Mockup Frame -->
    <rect x="-140" y="-200" width="280" height="420" rx="24" fill="#1b1c21" stroke="#484d5c" stroke-width="2" />
    
    <!-- Phone Speaker Notch -->
    <rect x="-40" y="-188" width="80" height="6" rx="3" fill="#30333d" />
    
    <!-- Phone Screen Surface -->
    <rect x="-124" y="-170" width="248" height="370" rx="14" fill="#141519" />

    <!-- PWA App Header -->
    <rect x="-124" y="-170" width="248" height="45" fill="#1f2128" />
    <text x="-105" y="-142" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#ffffff" font-weight="600">Lorem App</text>
    <circle cx="100" cy="-147" r="4" fill="#22c55e" />

    <!-- Appointment Queue Badge -->
    <rect x="-110" y="-110" width="220" height="55" rx="8" fill="#252832" stroke="#38bdf8" stroke-width="1" />
    <text x="-95" y="-90" font-family="monospace" font-size="9" fill="#38bdf8">LIVE QUEUE // CONSULTATION #04</text>
    <text x="-95" y="-70" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#ffffff" font-weight="600">Dr. Sarah Alcantara, MD</text>

    <!-- Calendar Time Slots Wireframe -->
    <text x="-110" y="-35" font-family="monospace" font-size="9" fill="#8c919e">AVAILABLE TIME SLOTS</text>
    <rect x="-110" y="-20" width="66" height="28" rx="4" fill="#1d1e24" stroke="#333742" stroke-width="1" />
    <text x="-77" y="-2" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">09:00</text>

    <rect x="-33" y="-20" width="66" height="28" rx="4" fill="#0284c7" />
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff" font-weight="600">10:30</text>

    <rect x="44" y="-20" width="66" height="28" rx="4" fill="#1d1e24" stroke="#333742" stroke-width="1" />
    <text x="77" y="-2" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">13:00</text>

    <!-- Consultation Action Button -->
    <rect x="-110" y="25" width="220" height="34" rx="8" fill="url(#cyan-gradient)" />
    <text x="0" y="47" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#000000" font-weight="700">CONFIRM CONSULTATION</text>

    <!-- Patient Records Card -->
    <rect x="-110" y="75" width="220" height="95" rx="8" fill="#1b1c22" stroke="#2c2f3a" stroke-width="1" />
    <text x="-95" y="98" font-family="monospace" font-size="9" fill="#8c919e">PATIENT TELEMETRY</text>
    <text x="-95" y="120" font-family="monospace" font-size="11" fill="#22c55e">PULSE: 72 BPM · SPO2: 99%</text>
    <text x="-95" y="145" font-family="monospace" font-size="9" fill="#64748b">ENCRYPTED HEALTHCARE VAULT</text>

    <!-- Left & Right Architecture Notation -->
    <!-- Left: Supabase & Auth Database Node -->
    <g transform="translate(-400, -80)">
      <rect x="0" y="0" width="210" height="160" rx="8" fill="#1a1b20" stroke="#30333e" stroke-width="1" />
      <text x="15" y="25" font-family="monospace" font-size="10" fill="#38bdf8">DATABASE ARCHITECTURE</text>
      <text x="15" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#f8fafc" font-weight="600">Supabase DB</text>
      <text x="15" y="80" font-family="monospace" font-size="10" fill="#8c919e">POSTGRESQL + ROW SECURITY</text>
      <line x1="15" y1="100" x2="195" y2="100" stroke="#282a32" stroke-width="1" />
      <text x="15" y="125" font-family="monospace" font-size="10" fill="#22c55e">● REALTIME SYNC (WEBSOCKET)</text>
    </g>

    <!-- Right: Telemedicine Calendar Engine -->
    <g transform="translate(190, -80)">
      <rect x="0" y="0" width="210" height="160" rx="8" fill="#1a1b20" stroke="#30333e" stroke-width="1" />
      <text x="15" y="25" font-family="monospace" font-size="10" fill="#38bdf8">SCHEDULE ENGINE</text>
      <text x="15" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#f8fafc" font-weight="600">Smart Calendar</text>
      <text x="15" y="80" font-family="monospace" font-size="10" fill="#8c919e">TIMEZONE CALIBRATION</text>
      <line x1="15" y1="100" x2="195" y2="100" stroke="#282a32" stroke-width="1" />
      <text x="15" y="125" font-family="monospace" font-size="10" fill="#38bdf8">AUTOMATED SMS NOTIFICATIONS</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(70, 810)">
    <line x1="0" y1="0" x2="1060" y2="0" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" />
    <text x="0" y="28" font-family="monospace" font-size="10" fill="#6d7280" letter-spacing="2">
      STACK: REACT · TYPESCRIPT · SUPABASE · REST APIS · TAILWIND CSS
    </text>
    <text x="1060" y="28" text-anchor="end" font-family="monospace" font-size="10" fill="#38bdf8" letter-spacing="2">
      LOREM IPSUM TEMPLATE
    </text>
  </g>
</svg>
