<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Monochrome Deep Luxury Obsidian Gradients -->
    <linearGradient id="banner-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22" />
      <stop offset="45%" stop-color="#121316" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <radialGradient id="banner-spotlight" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>

    <!-- Silver Metallic Gradients for Horizon & Geometrics -->
    <linearGradient id="silver-horizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titanium-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#a1a1aa" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Architectural Matrix Pattern -->
    <pattern id="matrix-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
      <circle cx="48" cy="48" r="0.75" fill="#ffffff" fill-opacity="0.2" />
    </pattern>

    <!-- Linear Fade Mask to Base -->
    <linearGradient id="bottom-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas & Ambient Spotlight -->
  <rect width="1200" height="500" fill="url(#banner-sky)" />
  <rect width="1200" height="500" fill="url(#banner-spotlight)" />
  <rect width="1200" height="500" fill="url(#matrix-grid)" />

  <!-- Abstract Minimalist Architectural Perspective Wireframe -->
  <g transform="translate(600, 260)">
    <!-- Receding Horizon Coordinate Grid Lines -->
    <path d="M -600 0 L 600 0" stroke="url(#silver-horizon)" stroke-width="1.2" />
    
    <!-- Perspective Rays emanating from Center Focus -->
    <line x1="0" y1="0" x2="-600" y2="240" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15" />
    <line x1="0" y1="0" x2="-450" y2="240" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12" />
    <line x1="0" y1="0" x2="-300" y2="240" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.18" />
    <line x1="0" y1="0" x2="-150" y2="240" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.22" />
    <line x1="0" y1="0" x2="0" y2="240" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <line x1="0" y1="0" x2="150" y2="240" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.22" />
    <line x1="0" y1="0" x2="300" y2="240" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.18" />
    <line x1="0" y1="0" x2="450" y2="240" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12" />
    <line x1="0" y1="0" x2="600" y2="240" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15" />

    <!-- Isometric Transverse Plane Lines -->
    <line x1="-500" y1="40" x2="500" y2="40" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15" />
    <line x1="-540" y1="90" x2="540" y2="90" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.2" />
    <line x1="-570" y1="150" x2="570" y2="150" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.25" />
    <line x1="-600" y1="220" x2="600" y2="220" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />

    <!-- Center Monolithic Architectural Pavilions (Isometric Silhouette) -->
    <!-- Center Tower / Monolith -->
    <polygon points="-80,0 80,0 120,-160 -120,-160" fill="url(#titanium-beam)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" />
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Left Wing Flank -->
    <polygon points="-260,0 -100,0 -130,-110 -280,-110" fill="#14151a" fill-opacity="0.5" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.2" />
    <line x1="-195" y1="0" x2="-205" y2="-110" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15" />
    
    <!-- Right Wing Flank -->
    <polygon points="100,0 260,0 280,-110 130,-110" fill="#14151a" fill-opacity="0.5" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.2" />
    <line x1="195" y1="0" x2="205" y2="-110" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15" />

    <!-- Ambient Core Light Ring behind Monolith -->
    <circle cx="0" cy="-60" r="140" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" />
    <circle cx="0" cy="-60" r="110" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4 6" stroke-opacity="0.18" />
    <circle cx="0" cy="-60" r="80" fill="none" stroke="url(#silver-horizon)" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Technical Top Header Branding & Coordinates -->
  <g transform="translate(60, 48)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" letter-spacing="3" fill="#a1a1aa" text-transform="uppercase" opacity="0.75">
    <text x="0" y="0">DIGITAL NFC ARCHITECTURE</text>
    <text x="0" y="16" font-family="monospace" font-size="9" fill="#71717a" letter-spacing="1.5">PRECISION DESIGN // 001</text>
  </g>

  <g transform="translate(1140, 48)" text-anchor="end" font-family="monospace" font-size="9" letter-spacing="2" fill="#a1a1aa" opacity="0.75">
    <text x="0" y="0">LAT 00°00'N · LON 00°00'E</text>
    <text x="0" y="16" fill="#71717a">CARD PROTOCOL // NFC-V3</text>
  </g>

  <!-- Precision Framing Crosshairs -->
  <g stroke="#ffffff" stroke-width="0.75" opacity="0.35">
    <path d="M 40 40 L 56 40 M 48 32 L 48 48" />
    <path d="M 1160 40 L 1144 40 M 1152 32 L 1152 48" />
  </g>

  <!-- Subtle Radial Glow Bloom at Center -->
  <ellipse cx="600" cy="200" rx="280" ry="100" fill="#ffffff" opacity="0.04" />

  <!-- Bottom Dark Gradient Overlay for Seamless Blend with Profile Body -->
  <rect y="160" width="1200" height="340" fill="url(#bottom-fade)" />
</svg>

